<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Fornecedores</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Cadastro de Fornecedores</h1>

    <!-- Formulário Dinâmico: Cadastro e Edição -->
    <form id="formproduto" class="card">
      <input type="hidden" id="produtoId">

      <div class="campo">
        <label for="nome">Razão Social:</label>
        <input type="text" id="razao_social" required placeholder="Ex: Petrobas BRASIL">
      </div>

      <div class="campo">
        <label for="descricao">CNPJ:</label>
        <input type="descricao" id="cnpj" required placeholder="Ex: 12345678901234">
      </div>

      <div class="campo">
        <label for="descricao">Contato:</label>
        <input type="descricao" id="contato" required placeholder="Ex: petobrar@email.com">
      </div>

      <div class="campo">
        <label for="descricao">Telefone:</label>
        <input type="descricao" id="telefone" required placeholder="Ex: (11) 99888-1111">
      </div>

      <div class="botoes-form">
        <button type="submit" id="btnSalvar">Cadastrar</button>
        <button type="button" id="btnCancelar" class="btn-secundario" style="display: none;">Cancelar</button>
      </div>
    </form>

    <!-- Feedback visual -->
    <div id="statusMensagem" class="status-alerta"></div>

    <!-- Tabela de Listagem -->
    <div class="card">
      <h2>Fornecedores Cadastrados</h2>
      <table class="tabela-produtos">
        <thead>
          <tr>
            <th>Razão Social</th>
            <th>CNPJ</th>
            <th>Contato</th>
            <th>Telefone</th>
          </tr>
        </thead>
        <tbody id="tabelaCorpo"></tbody>
      </table>
    </div>
  </div>

  <!-- Axios via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <!-- Lógica da Aplicação -->
  <script src="fornecedores.js"></script>
</body>
</html>
